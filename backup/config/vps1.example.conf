# Phase 2 example for VPS1. This file contains no credentials or secrets.
# Copy it to an ignored *.conf file before adapting it for the real server.

# Required: safe label used in directory, archive, and log names.
BACKUP_NAME="vps1"

# Required indexed array: absolute files or directories copied read-only into
# the archive under paths/. Missing paths fail a real backup but only warn in a
# dry run.
BACKUP_PATHS=(
    "/etc/hostname"
    "/etc/os-release"
    "/etc/nginx"
)

# Required indexed array. Format: output-file|command
# Use read-only diagnostics only. Commands run only during a real backup;
# remove entries for tools that are not installed on this server.
COMMAND_OUTPUTS=(
    "docker-ps.txt|docker ps"
    "docker-images.txt|docker images"
    "docker-volumes.txt|docker volume ls"
    "systemd-units.txt|systemctl list-units --all --no-pager"
    "crontab.txt|crontab -l || true"
)

# Optional. Defaults are backup/work and backup/archives in this repository.
# Both values must be absolute paths and must not be inside a BACKUP_PATHS path.
# BACKUP_WORK_ROOT="/var/tmp/sdrc-backup/work"
# BACKUP_OUTPUT_DIR="/var/backups/sdrc"

# Optional: preserve staged files after a successful or failed run for review.
KEEP_WORKDIR=false
