# Example VPS1 backup configuration. Copy and customize; never add secrets here.

BACKUP_NAME="vps1"
BACKUP_PATHS=(
    "/etc"
    "/opt/sdrc"
)

# Format: output-name|command
COMMAND_CAPTURES=(
    "system.txt|uname -a"
    "packages.txt|dpkg-query -W"
)

# Add database-native dump commands appropriate for the host.
DATABASE_DUMPS=(
    "postgres.sql|pg_dumpall"
)

AGE_RECIPIENT="REPLACE_WITH_AGE_RECIPIENT"
AGE_IDENTITY_FILE="${AGE_IDENTITY_FILE:-}"

FTP_ENABLED=false
FTP_URL="ftp://REPLACE_WITH_HOST"
FTP_USER="REPLACE_WITH_USER"
FTP_PASSWORD_FILE="${FTP_PASSWORD_FILE:-}"
FTP_REMOTE_DIR="/sdrc-backups/vps1"

KEEP_LOCAL_BACKUPS=7
KEEP_WORKDIR=false

