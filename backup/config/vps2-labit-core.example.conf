# Postgres backup for the labit_core schema on VPS2 (supabase-db).
# Copy to an ignored *.conf file before adapting it for real use.
#
# Unlike vps1.conf/vps2.example.conf (which back up local files/diagnostics
# on the machine backup.sh runs on), this config's COMMAND_OUTPUTS entry
# pulls a pg_dump over SSH from a REMOTE host (VPS2). Run this FROM the
# devserver or any LAN machine with SSH access to root@supabase.sdrc.in —
# never run it on VPS2 itself piping to itself, and never on VPS1.
#
# Every run of backup.sh against this config produces one full logical dump
# of labit_core (currently ~150MB uncompressed SQL, well under a minute to
# dump and compress) — there is no meaningful "incremental" dump for a
# database this small; running the SAME full backup daily is the practical
# equivalent, cheaper and simpler to restore than WAL-based incrementals.
# RETENTION_* below keeps every run for RETENTION_DAILY_DAYS, and additionally
# keeps the run that lands on RETENTION_WEEKLY_DOW for the longer
# RETENTION_WEEKLY_DAYS — i.e. "daily backups, weekly ones kept longer".
#
# Required before running:
#   export LABIT_PG_BACKUP_PASSWORD=$(ssh root@supabase.sdrc.in \
#     "grep '^POSTGRES_PASSWORD=' /opt/supabase/docker/.env | cut -d= -f2-")
# (see backup/scripts/pg_dump_labit_core.sh header for details/overrides)

BACKUP_NAME="vps2-labit-core"

# No local files to copy — this backup is entirely the remote pg_dump below.
BACKUP_PATHS=()

COMMAND_OUTPUTS=(
    "labit-core-schema-dump.txt|${SCRIPT_DIR}/scripts/pg_dump_labit_core.sh"
)

# A failed dump must fail the whole backup — never publish an empty/partial
# archive as if it were a real backup.
COMMAND_OUTPUTS_FATAL=true

# Optional. Defaults are backup/work and backup/archives in this repository.
# BACKUP_WORK_ROOT="/var/tmp/sdrc-backup/work"
# BACKUP_OUTPUT_DIR="/var/backups/sdrc"

KEEP_WORKDIR=false

# Encryption. The recipients file contains public age recipients only;
# never place an age secret identity/key in this repository.
ENCRYPTION_ENABLED=false
AGE_BINARY="age"
AGE_RECIPIENTS_FILE="/etc/sdrc-backup/recipients/vps2-labit-core.txt"
AGE_IDENTITY_FILE=""
KEEP_UNENCRYPTED_ARCHIVE=false

# Hostinger FTP upload. Export the password under FTP_PASSWORD_ENV;
# never put the password in this file.
FTP_ENABLED=false
FTP_HOST=""
FTP_PORT=21
FTP_USER=""
FTP_PASSWORD_ENV="SDRC_BACKUP_FTP_PASSWORD"
FTP_REMOTE_DIR="/backups/labit-core"
FTP_SSL_VERIFY_CERT=true

# Optional Google Drive/other desktop-sync handoff. Point this at a folder
# already managed by the sync client. Prefer encrypted archives for cloud sync.
SYNC_FOLDER_ENABLED=false
SYNC_FOLDER_DIR="/srv/google-drive/SDRC-Backups/vps2-labit-core"

# Optional off-site push via rclone, to a remote already configured with
# `rclone config` on this host (e.g. a Google Drive OAuth remote). Publishes
# under a FIXED filename every run so the remote's own version history is
# the off-site retention mechanism -- rclone does not manage remote
# retention itself. Encrypt first; do not push unencrypted archives.
RCLONE_ENABLED=false
RCLONE_BINARY="rclone"
RCLONE_REMOTE="remote-name:SDRC-Backups/vps2-labit-core"

# Local retention: keep every archive for RETENTION_DAILY_DAYS; additionally
# keep the archive whose run timestamp falls on RETENTION_WEEKLY_DOW
# (1=Monday .. 7=Sunday) for the longer RETENTION_WEEKLY_DAYS. Pruning only
# runs after a real (non dry-run) backup completes successfully.
RETENTION_ENABLED=true
RETENTION_DAILY_DAYS=14
RETENTION_WEEKLY_DAYS=84
RETENTION_WEEKLY_DOW=7
