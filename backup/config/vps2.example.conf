# Example for VPS2. This file contains no credentials or secrets.
# Copy it to an ignored *.conf file before adapting it for the real server.

# Required: safe label used in directory, archive, and log names.
BACKUP_NAME="vps2"

# Required indexed array: absolute files or directories copied read-only into
# the archive under paths/. Replace these examples with VPS2's actual paths.
BACKUP_PATHS=(
    "/etc/hostname"
    "/etc/os-release"
    "/etc/systemd/system"
)

# Required indexed array. Format: output-file|command
# Use read-only diagnostics only. Commands run only during a real backup;
# remove entries for tools that are not installed on this server.
COMMAND_OUTPUTS=(
    "docker-ps.txt|docker ps"
    "docker-images.txt|docker images"
    "docker-volumes.txt|docker volume ls"
    "systemd-units.txt|systemctl list-units --all --no-pager"
    "crontab.txt|crontab -l"
)

# Diagnostic commands are best-effort by default. Set true only when every
# configured diagnostic must succeed for the backup to continue.
COMMAND_OUTPUTS_FATAL=false

# Optional. Defaults are backup/work and backup/archives in this repository.
# Both values must be absolute paths and must not be inside a BACKUP_PATHS path.
# BACKUP_WORK_ROOT="/var/tmp/sdrc-backup/work"
# BACKUP_OUTPUT_DIR="/var/backups/sdrc"

# Optional: preserve staged files after a successful or failed run for review.
KEEP_WORKDIR=false

# Encryption. The recipients file contains public age recipients only;
# never place an age secret identity/key in this repository.
ENCRYPTION_ENABLED=false
AGE_BINARY="age"
AGE_RECIPIENTS_FILE="/etc/sdrc-backup/recipients/vps2.txt"
# Set this only on the protected restore host, never on the source VPS.
AGE_IDENTITY_FILE=""
KEEP_UNENCRYPTED_ARCHIVE=false

# Hostinger FTP upload. Export the password under FTP_PASSWORD_ENV;
# never put the password in this file.
FTP_ENABLED=false
FTP_HOST=""
FTP_PORT=21
FTP_USER=""
FTP_PASSWORD_ENV="SDRC_BACKUP_FTP_PASSWORD"
FTP_REMOTE_DIR="/backups"
FTP_SSL_VERIFY_CERT=true

# Optional Google Drive/other desktop-sync handoff. Point this at a folder
# already managed by the sync client. Prefer encrypted archives for cloud sync.
SYNC_FOLDER_ENABLED=false
SYNC_FOLDER_DIR="/srv/google-drive/SDRC-Backups/vps2"

# Optional off-site push via rclone, to a remote already configured with
# `rclone config` on this host (e.g. a Google Drive OAuth remote). Publishes
# under a FIXED filename every run so the remote's own version history is
# the off-site retention mechanism -- rclone does not manage remote
# retention itself. Encrypt first; do not push unencrypted archives.
RCLONE_ENABLED=false
RCLONE_BINARY="rclone"
RCLONE_REMOTE="remote-name:SDRC-Backups/vps2"
